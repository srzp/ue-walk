version: 1

indices:
  pages:
    include:
      - '/**'
    exclude:
      - '/**.json'
    target: /query-index.json
    properties:
      pageTitle:
        select: head > meta[property="pageTitle"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")
  nav:
    include:
      - '/home/*'
    target: /home/nav-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      navOrder:
        select: head > meta[name="nav-order"]
        value: attribute(el, "content")
      navHide:
        select: head > meta[name="nav-hide"]
        value: attribute(el, "content")
      titulo:
        select: head > meta[property="titulo"]
        value: attribute(el, "content")